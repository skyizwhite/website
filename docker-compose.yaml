services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      WEBSITE_ENV: ${WEBSITE_ENV}
      WEBSITE_URL: ${WEBSITE_URL}
      KOYA_URL: ${KOYA_URL}
      KOYA_API_KEY: ${KOYA_API_KEY}
      KOYA_WEBHOOK_KEY: ${KOYA_WEBHOOK_KEY}
      KOYA_SECRET: ${KOYA_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
