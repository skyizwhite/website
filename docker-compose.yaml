services:
  app:
    build:
      context: .
      # qlot install resolves a dozen hosts during the build; the default build
      # network's DNS has failed on one of them (NS-HOST-NOT-FOUND) and taken the
      # deploy down with it. The host's resolver does not.
      network: host
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      WEBSITE_ENV: ${WEBSITE_ENV}
      WEBSITE_URL: ${WEBSITE_URL}
      KOYA_URL: ${KOYA_URL}
      KOYA_DELIVERY_KEY: ${KOYA_DELIVERY_KEY}
      KOYA_WEBHOOK_KEY: ${KOYA_WEBHOOK_KEY}
      KOYA_MANAGEMENT_KEY: ${KOYA_MANAGEMENT_KEY}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 2s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
