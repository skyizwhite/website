name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/skyizwhite/website

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies and compile
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          target: build
          outputs: type=cacheonly
          cache-from: type=gha

      - name: Run tests
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          target: test
          outputs: type=cacheonly
          cache-from: type=gha

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy koya schema
        env:
          WEBSITE_URL: ${{ vars.WEBSITE_URL }}
          KOYA_URL: ${{ secrets.KOYA_URL }}
          KOYA_MANAGEMENT_KEY: ${{ secrets.KOYA_MANAGEMENT_KEY }}
        run: |
          docker run --rm \
            -e WEBSITE_URL -e KOYA_URL -e KOYA_MANAGEMENT_KEY \
            "$IMAGE:$GITHUB_SHA" deploy-schema

      - name: Tag image as latest
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$GITHUB_SHA"

      - name: Trigger Coolify deploy
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error --request POST "$COOLIFY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"
